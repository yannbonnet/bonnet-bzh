name: Déploiement OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet nécessaire : le sitemap dérive lastmod du
          # dernier commit de chaque fichier de contenu (git log), pas
          # seulement du HEAD superficiel que checkout récupère par défaut.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installe les dépendances
        run: npm ci

      - name: Construit le site
        run: npm run build

      - name: Dépôt FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./www/
          local-dir: ./dist/
